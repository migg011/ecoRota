<div class="cadastro-container">

  <div class="cadastro-card">

    <h1>Criar conta</h1>

    <p class="subtitle">
      Cadastre-se no EcoRota
    </p>

    <form (ngSubmit)="onSubmit()">

      <div class="field">
        <label for="name">Nome</label>
        <input
          id="name"
          name="name"
          type="text"
          placeholder="Digite seu nome"
          [(ngModel)]="userData.nome_completo"
          required
        >
      </div>

      <div class="field">
        <label for="email">E-mail</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="Digite seu e-mail"
          [(ngModel)]="userData.email"
          required
        >
      </div>

      <div class="field">
        <label for="password">Senha</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Digite sua senha"
          [(ngModel)]="userData.password"
          required
        >
      </div>

      <p *ngIf="errorMessage" class="error-message" style="color: #d9534f; font-size: 0.875rem; margin-top: 8px;">
        {{ errorMessage }}
      </p>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Criando conta...' : 'Criar conta' }}
      </button>

    </form>

    <p class="login-text">
      Já possui uma conta?
      <a routerLink="/login">Voltar para login</a>
    </p>

  </div>

</div>
